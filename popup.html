<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 200px; margin: 0; padding: 14px; font: 13px sans-serif; color: #222; }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; }
    label + label { margin-top: 10px; }
    select { margin-left: auto; }
    small { display: block; margin-top: 8px; color: #888; }
  </style>
</head>
<body>
  <h1>Auto Next Lecture</h1>
  <label><input type="checkbox" id="enabled"> 자동 넘김 켜기</label>
  <label>재생 속도 <select id="speed"></select></label>
  <label>이어보기 팝업
    <select id="resume">
      <option value="no">아니오 (처음부터)</option>
      <option value="yes">예 (이어보기)</option>
    </select>
  </label>
  <small>1.0x가 아니거나 이어보기를 쓰면 진도율에 반영되지 않을 수 있어요.</small>
  <script src="popup.js"></script>
</body>
</html>
